on:
  schedule:
    - cron: "0 0 */14 * *"   # Runs every 14 days at midnight UTC
  workflow_dispatch:         # Allows manual trigger from GitHub UI

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Set up environment
        run: sudo apt-get install -y postgresql-client

      - name: Dump Supabase DB
        env:
          PGHOST: ${{ secrets.SUPABASE_DB_HOST }}
          PGPORT: 5432
          PGUSER: ${{ secrets.SUPABASE_DB_USER }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGDATABASE: ${{ secrets.SUPABASE_DB_NAME }}
        run: |
          TIMESTAMP=$(date +'%Y-%m-%d_%H-%M-%S')
          pg_dump --no-owner --no-privileges -Fc -f backup_$TIMESTAMP.dump
          echo "Backup file created: backup_$TIMESTAMP.dump"

      - name: Upload Backup Artifact
        uses: actions/upload-artifact@v3
        with:
          name: supabase-db-backup
          path: backup_*.dump